<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1c1a" />
    <meta name="description" content="不登录、不上传，在手机本地为照片添加胶片质感。" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="See" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="See｜手机胶片滤镜" />
    <meta property="og:description" content="不登录、不上传，在手机本地为照片添加胶片质感。" />
    <meta property="og:url" content="https://shawnboom.github.io/s-film/" />
    <meta property="og:image" content="https://shawnboom.github.io/s-film/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="See｜手机胶片滤镜" />
    <meta name="twitter:description" content="不登录、不上传，在手机本地为照片添加胶片质感。" />
    <meta name="twitter:image" content="https://shawnboom.github.io/s-film/og.png" />
    <title>See｜手机胶片滤镜</title>
    <link rel="apple-touch-icon" href="./apple-touch-icon.png?v=19" />
    <link rel="apple-touch-icon" sizes="120x120" href="./icons/see-apple-touch-icon-120.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./icons/see-apple-touch-icon-152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./icons/see-apple-touch-icon-167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/see-apple-touch-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/see-icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest?v=19" />
    <link rel="stylesheet" href="./styles.css?v=19" />
    <script type="module" src="./app.js?v=19"></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="editor-card interaction-surface" aria-label="See 照片滤镜">
        <header class="topbar">
          <img class="brand-logo" src="./see-logo.png" width="1306" height="591" alt="See" draggable="false" />
          <p class="privacy-note"><span aria-hidden="true"></span>照片仅在本机处理</p>
        </header>

        <section class="photo-stage" id="photo-stage">
          <canvas id="preview" class="preview-canvas" aria-label="照片滤镜预览"></canvas>
          <button class="empty-upload" id="empty-upload" type="button">添加照片</button>
          <button class="compare-button" id="compare-button" type="button" hidden>Original</button>
          <button class="delete-button" id="delete-button" type="button" aria-label="删除当前照片" hidden></button>
          <span class="photo-count" id="photo-count" hidden></span>
        </section>

        <section class="thumbnail-rail" id="thumbnail-rail" aria-label="照片列表">
          <button class="thumbnail add-photo" id="add-photo" type="button" aria-label="添加照片">+</button>
        </section>

        <input class="visually-hidden" id="photo-input" type="file" accept="image/*" multiple />

        <section class="filter-row" aria-label="滤镜">
          <button class="filter-button" type="button" data-filter="classic" aria-pressed="false" aria-label="S01 FUJI Classic Chrome" disabled>S01</button>
          <button class="filter-button" type="button" data-filter="gold" aria-pressed="false" aria-label="S02 KODAK Gold 200" disabled>S02</button>
          <button class="filter-button" type="button" data-filter="youth" aria-pressed="false" aria-label="S03 FUJI Youth Blue" disabled>S03</button>
        </section>

        <section class="adjustment-panel">
          <nav class="adjustment-tabs" aria-label="微调项目">
            <button class="adjustment-tab" type="button" data-adjustment="strength" aria-pressed="false" disabled>Strength</button>
            <button class="adjustment-tab is-active" type="button" data-adjustment="brightness" aria-pressed="true" disabled>Light</button>
            <button class="adjustment-tab" type="button" data-adjustment="color" aria-pressed="false" disabled>Color</button>
            <button class="adjustment-tab" type="button" data-adjustment="grain" aria-pressed="false" disabled>Grain</button>
          </nav>
          <div class="slider-row">
            <input
              id="active-adjustment"
              class="range-control"
              aria-label="Light"
              type="range"
              min="-100"
              max="100"
              value="0"
              disabled
              style="--range-progress: 50%"
            />
            <label class="value-input" aria-label="Light value">
              <input
                id="adjustment-value"
                type="number"
                inputmode="numeric"
                min="-100"
                max="100"
                step="1"
                value="0"
                aria-label="Light value"
                disabled
              />
              <span aria-hidden="true">%</span>
            </label>
          </div>
        </section>

        <div class="bottom-actions">
          <button class="bottom-action reset-action" id="reset-current" type="button" disabled>Reset</button>
          <button class="bottom-action apply-action" id="apply-all" type="button" disabled>Apply All</button>
          <button class="bottom-action save-action" id="export-button" type="button" disabled>Save</button>
        </div>
        <p class="visually-hidden" id="status-line" role="status" aria-live="polite">等待添加照片</p>
        <div class="toast" id="toast" role="status" hidden></div>
      </section>
    </main>
  </body>
</html>
